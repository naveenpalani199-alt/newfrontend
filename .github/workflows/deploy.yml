name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install React task dependencies
        run: |
          for project in \
            REACT/Day2/my-react-project \
            REACT/Day3/myproject \
            REACT/Day3/myproject2 \
            REACT/Day4/myapp \
            REACT/Day5/day5project \
            REACT/Day6/day6project \
            REACT/Day7/day7project \
            REACT/Day8/day8project \
            REACT/Day9/day9project \
            REACT/Day10/day10project
          do
            npm ci --prefix "$project"
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build project
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
